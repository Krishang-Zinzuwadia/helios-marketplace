name: Suggest a specialist
description: Have a job Helios should be good at? Tell us about it.
title: "Specialist request: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Got a role we’re missing? Tell us what it should do. The catalog is still a UI preview, so new entries are role ideas, not downloadable models.
  - type: input
    id: specialization
    attributes:
      label: What should we call it?
      description: Give it a short, specific name.
      placeholder: "Example: Accessibility Audit SLM"
    validations:
      required: true
  - type: textarea
    id: job
    attributes:
      label: What should it do?
      description: Describe the job in a sentence or two.
      placeholder: "Review a product flow and point out the accessibility problems worth fixing first."
    validations:
      required: true
  - type: textarea
    id: inputs
    attributes:
      label: What would you give it?
      description: List the files, context, or data it would need.
      placeholder: "Rendered pages, accessibility rules, target browsers..."
    validations:
      required: true
  - type: textarea
    id: outputs
    attributes:
      label: What should it hand back?
      description: Describe the result someone should be able to use or review.
      placeholder: "A ranked list of problems with proof and suggested fixes..."
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Where should it stop?
      description: What should it never do, and how would you check its work?
    validations:
      required: true
  - type: checkboxes
    id: preview
    attributes:
      label: One last check
      options:
        - label: I understand this is a catalog idea, not a model upload or a compatibility request.
          required: true
